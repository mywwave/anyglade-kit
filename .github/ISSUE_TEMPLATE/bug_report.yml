name: Bug report
description: Something in the kit looks or behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal code sample, a link to a repository or the playground block.
      render: tsx
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "@anyglade/kit version"
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140, macOS 16
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
