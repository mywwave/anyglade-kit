name: Feature request
description: Propose a component, a pattern or a change to the system.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind. Sketches and references are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried
      description: Can it be built from existing components? Why is that not enough?
